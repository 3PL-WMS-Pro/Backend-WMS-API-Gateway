server:
  port: 6001

spring:
  application:
    name: wms-api-gateway
  main:
    web-application-type: reactive
  cloud:
    gateway:
      # ─────────────────────────────────────────────────────────────────────
      # Routes are defined EXCLUSIVELY in GatewayConfig.kt (customRouteLocator).
      #
      # This block previously mirrored 34 of those routes per an old project
      # convention. Every one of them was a path-duplicate of a Kotlin route,
      # but WITHOUT the `filters:` block — so each carried no JWT validation.
      # Spring Cloud Gateway registered both sets and which one matched was
      # decided by route ordering that nothing pinned explicitly. Production
      # happened to favour the filtered Kotlin routes (verified: unauthenticated
      # probes returned 401), but a Boot upgrade, a config reshuffle, or someone
      # adding `order:` to a yml route could have silently disabled auth across
      # most of the API with no error and no log line.
      #
      # Verified before removal: all 34 yml route ids mapped to paths already
      # covered by GatewayConfig.kt. Two looked yml-only by id
      # (tenant-service-tenant-settings, tenant-service-user-role-mappings) but
      # resolve to the same paths as the Kotlin tenant-service-settings and
      # tenant-service-user-roles. Nothing was lost.
      #
      # Do not re-add routes here. One source of truth.
      # ─────────────────────────────────────────────────────────────────────
      default-filters: []

portal:
  jwt:
    # MUST match wms-customer-portal-service's `portal.jwt.secret`, and MUST differ from
    # `jwt.secret`. If the two were the same, a customer-portal token would verify against
    # staff routes — where JwtAuthenticationFilter performs no role check and forwards
    # X-User-Id / X-Tenant-Id straight from the claims.
    secret: ${PORTAL_JWT_SECRET:portal-dev-only-secret-key-change-me-at-least-32-bytes}
  cors:
    # Comma-separated. Env-driven because the final portal hostname is still undecided.
    allowed-origins: ${PORTAL_CORS_ORIGINS:http://localhost:3100}

eureka:
  client:
    service-url:
      defaultZone: http://localhost:6000/eureka/
  instance:
    prefer-ip-address: true

logging:
  level:
    com.wmspro.gateway: DEBUG
    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: WARN
    reactor.netty.http.server: INFO